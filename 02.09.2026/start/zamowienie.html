<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Twoje imię i nazwisko" />
    <title>Oblicz cenę — Lodziarnia</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Lodziarnia Letnia</h1>

        <nav>
          <ul>
            <li><a href="index.html">Start</a></li>
            <li><a href="zamowienie.html" class="active">Zamówienie</a></li>
          </ul>
        </nav>
      </header>

      <div class="srodek">
        <main>
          <h2>Oblicz cenę</h2>
          <form>
            <label for="smak">Smak: </label>
            <select id="smak">
              <option value="5">Truskakowy 5 zł</option>
              <option value="4">Waniliowy 4 zł</option>
              <option value="6">Czekoladowy 6 zł</option>
            </select>
            <br />
            <label
              >Ilość: <input type="number" id="ilosc" min="1" max="5" value="1"
            /></label>
            <br />
            <input type="button" value="Oblicz" id="oblicz" />
          </form>
          <p>Do zapłaty: <span id="wynik"></span></p>
        </main>

        <aside>
          <h3>Nasze smaki</h3>
          <ul>
            <li>Truskakowy — 5 zł</li>
            <li>Waniliowy — 4 zł</li>
            <li>Czekoladowy — 6 zł</li>
          </ul>
        </aside>
      </div>

      <footer>
        <p><span>Kacper Zieliński</span> 4Ti</p>
      </footer>
    </div>
  </body>
</html>
